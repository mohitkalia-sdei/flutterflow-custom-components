name: flutterflow_custom_components
description: Reusable custom Flutter widgets and custom actions ready to plug directly into FlutterFlow visual low-code projects.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
